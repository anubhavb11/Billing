<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bansal Store</title>
    <meta name="description" content="Bills from Bansal Store, A-135 Madhu Vihar Lane no - 8. Ph. 7678642241" />
    <meta name="theme-color" content="#e25629" />
    <meta name="application-name" content="Bansal Store" />
    <meta name="apple-mobile-web-app-title" content="Bansal Store" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Link previews (WhatsApp etc.). REACT_APP_SITE_URL is the site address, set at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bansal Store" />
    <meta property="og:title" content="Bansal Store" />
    <meta property="og:description" content="Your bill from Bansal Store, A-135 Madhu Vihar Lane no - 8" />
    <meta property="og:image" content="%REACT_APP_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      /* Shown until the app has loaded. */
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #e25629;
        font-size: 22px;
        font-weight: 700;
      }
      .boot img {
        width: 88px;
        height: 88px;
      }
    </style>
  </head>
  <body>
    <noscript>Please turn on JavaScript to open Bansal Store bills.</noscript>
    <div id="root">
      <div class="boot">
        <img src="%PUBLIC_URL%/logo.svg" alt="" />
        Bansal Store
      </div>
    </div>
  </body>
</html>
