[build]
  # Same as the project's existing Netlify setting: a lint warning shouldn't fail the deploy.
  # REACT_APP_SITE_URL ($URL is set by Netlify) makes the link-preview image an absolute URL.
  command = "CI= REACT_APP_SITE_URL=$URL npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"

# Customer bill links (/b/<token>) are served by the app.
[[redirects]]
  from = "/b/*"
  to = "/index.html"
  status = 200

# The delivery boy's page (/d) is served by the app too.
[[redirects]]
  from = "/d"
  to = "/index.html"
  status = 200
